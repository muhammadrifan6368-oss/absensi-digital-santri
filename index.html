      feedback.className = "mb-4 rounded-xl px-4 py-3 text-sm font-medium";
      feedback.classList.add(type === "error" ? "bg-[#fce8e8]" : "bg-[#e0f2eb]");
      feedback.classList.add(type === "error" ? "text-[#9f2929]" : "text-[#126657]");
    }

    function clearFeedback() {
      feedback.className = "mb-4 hidden rounded-xl px-4 py-3 text-sm font-medium";
      feedback.textContent = "";
    }

    function matchesCurrentView(record) {
      const period = selectedPeriod();
      const filter = filterClassSelect.value;
      return record.bulan === period.bulan &&
        Number(record.tahun) === period.tahun &&
        (filter === "Semua Kelas" || record.kelas === filter);
    }

    function renderSummary() {
      const visible = records.filter(matchesCurrentView);
      const sum = key => visible.reduce((total, record) => total + safeNumber(record[key]), 0);
      document.getElementById("student-total").textContent = visible.length;
      document.getElementById("hadir-total").textContent = sum("hadir");
      document.getElementById("sakit-total").textContent = sum("sakit");
      document.getElementById("izin-total").textContent = sum("izin");
      document.getElementById("alpa-total").textContent = sum("alpa");
      document.getElementById("period-badge").textContent = `${monthSelect.value} ${yearSelect.value}`;
    }

    function classStyleName(kelas) {
      return `class-${kelas.toLocaleLowerCase("id-ID").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}`;
    }

    function applyClassStyle(row, kelas) {
      [...row.classList].filter(name => name.startsWith("class-")).forEach(name => row.classList.remove(name));
      row.classList.add(classStyleName(kelas));
    }

    function createRow(record) {
      const fragment = document.getElementById("attendance-row-template").content.cloneNode(true);
      const row = fragment.querySelector("[data-template-id='attendance-row']");
      row.dataset.recordId = record.__backendId;
      applyClassStyle(row, record.kelas);
      row.querySelector(".student-name").textContent = record.nama;
      row.querySelector(".student-class").textContent = record.kelas;
      row.querySelector(".hadir-input").value = safeNumber(record.hadir);
      row.querySelector(".sakit-input").value = safeNumber(record.sakit);
      row.querySelector(".izin-input").value = safeNumber(record.izin);
      row.querySelector(".alpa-input").value = safeNumber(record.alpa);

      row.querySelector(".save-row-button").addEventListener("click", () => saveRow(row, record.__backendId));
      row.querySelector(".delete-row-button").addEventListener("click", () => toggleDelete(row, true));
      row.querySelector(".cancel-delete-button").addEventListener("click", () => toggleDelete(row, false));
      row.querySelector(".confirm-delete-button").addEventListener("click", () => deleteRow(row, record.__backendId));
      return row;
    }

    function updateRow(row, record) {
      applyClassStyle(row, record.kelas);
      row.querySelector(".student-name").textContent = record.nama;
      row.querySelector(".student-class").textContent = record.kelas;
      if (document.activeElement !== row.querySelector(".hadir-input")) row.querySelector(".hadir-input").value = safeNumber(record.hadir);
      if (document.activeElement !== row.querySelector(".sakit-input")) row.querySelector(".sakit-input").value = safeNumber(record.sakit);
      if (document.activeElement !== row.querySelector(".izin-input")) row.querySelector(".izin-input").value = safeNumber(record.izin);
      if (document.activeElement !== row.querySelector(".alpa-input")) row.querySelector(".alpa-input").value = safeNumber(record.alpa);
    }

    function renderRecords() {
      const visible = records.filter(matchesCurrentView).sort((a, b) => a.nama.localeCompare(b.nama, "id"));
      const existing = new Map([...attendanceList.children].map(row => [row.dataset.recordId, row]));

      visible.forEach(record => {
        const row = existing.get(record.__backendId);
        if (row) {
          updateRow(row, record);
          existing.delete(record.__backendId);
        } else {
          attendanceList.appendChild(createRow(record));
        }
      });

      existing.forEach(row => row.remove());
      emptyState.classList.toggle("hidden", visible.length > 0);
      renderSummary();
    }

    function toggleDelete(row, show) {
      row.querySelector(".delete-row-button").classList.toggle("hidden", show);
      row.querySelector(".save-row-button").classList.toggle("hidden", show);
      row.querySelector(".delete-confirm").classList.toggle("hidden", !show);
      row.querySelector(".delete-confirm").classList.toggle("flex", show);
    }

    async function saveRow(row, recordId) {
      const record = records.find(item => item.__backendId === recordId);
      if (!record || !sdkReady) return;

      const saveButton = row.querySelector(".save-row-button");
      saveButton.disabled = true;
      const updatedRecord = {
        ...record,
        hadir: safeNumber(row.querySelector(".hadir-input").value),
        sakit: safeNumber(row.querySelector(".sakit-input").value),
        izin: safeNumber(row.querySelector(".izin-input").value),
        alpa: safeNumber(row.querySelector(".alpa-input").value)
      };

      const result = await window.dataSdk.update(updatedRecord);
      saveButton.disabled = false;

      if (result.isOk) {
        clearFeedback();
        showFeedback("Absen telah terkirim. Data absensi siswa berhasil disimpan.", "success");
      } else {
        showFeedback("Data belum dapat disimpan. Silakan coba lagi.", "error");
      }
    }

    async function deleteRow(row, recordId) {
      const record = records.find(item => item.__backendId === recordId);
      if (!record || !sdkReady) return;

      const confirmButton = row.querySelector(".confirm-delete-button");
      confirmButton.disabled = true;
      const result = await window.dataSdk.delete(record);

      if (!result.isOk) {
        confirmButton.disabled = false;
        showFeedback("Data belum dapat dihapus. Silakan coba lagi.", "error");
      } else {
        showFeedback("Data siswa berhasil dihapus.", "success");
      }
    }

    function parseNames(rawValue) {
      const unique = new Set();
      return rawValue
        .split(/\r?\n/)
        .map(line => line.split("\t")[0].trim())
        .filter(name => {
          const normalized = name.toLocaleLowerCase("id-ID");
          if (!name || unique.has(normalized)) return false;
          unique.add(normalized);
          return true;
        });
    }

    function pause(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    document.getElementById("roster-form").addEventListener("submit", async event => {
      event.preventDefault();
      clearFeedback();

      if (!sdkReady) {
        showFeedback("Aplikasi masih menyiapkan data. Silakan tunggu sebentar.", "error");
        return;
      }

      const input = document.getElementById("names-input");
      const names = parseNames(input.value);
      const button = document.getElementById("add-roster-button");
      const period = selectedPeriod();
      const kelas = document.getElementById("add-class-select").value;

      if (!names.length) {
        showFeedback("Masukkan setidaknya satu nama siswa terlebih dahulu.", "error");
        input.focus();
        return;
      }

      if (records.length + names.length > 999) {
        showFeedback("Batas maksimal 999 data telah tercapai. Hapus beberapa data terlebih dahulu.", "error");
        return;
      }

      button.disabled = true;
      let successCount = 0;

      for (let index = 0; index < names.length; index++) {
        const duplicate = records.some(item =>
          item.nama.toLocaleLowerCase("id-ID") === names[index].toLocaleLowerCase("id-ID") &&
          item.kelas === kelas &&
          item.bulan === period.bulan &&
          Number(item.tahun) === period.tahun
        );

        if (!duplicate) {
          const result = await window.dataSdk.create({
            nama: names[index],
            kelas,
            bulan: period.bulan,
            tahun: period.tahun,
            hadir: 0,
            sakit: 0,
            izin: 0,
            alpa: 0
          });
          if (result.isOk) successCount++;
          await pause(550);
        }
      }

      button.disabled = false;
      input.value = "";
      if (successCount > 0) {
        filterClassSelect.value = kelas;
        showFeedback(`${successCount} nama siswa berhasil ditambahkan ke ${kelas}.`, "success");
      } else {
        showFeedback("Tidak ada data baru ditambahkan. Nama tersebut mungkin sudah ada pada periode ini.", "error");
      }
    });

    [monthSelect, yearSelect, filterClassSelect].forEach(element => {
      element.addEventListener("change", () => {
        clearFeedback();
        renderRecords();
      });
    });

    async function initializeApp() {
      const monthIndex = currentDate.getMonth();
      monthSelect.value = monthNames[monthIndex];

      for (let year = currentDate.getFullYear() - 1; year <= currentDate.getFullYear() + 2; year++) {
        const option = document.createElement("option");
        option.value = year;
        option.textContent = year;
        if (year === currentDate.getFullYear()) option.selected = true;
        yearSelect.appendChild(option);
      }

      lucide.createIcons();
      renderSummary();

      const handler = {
        onDataChanged(data) {
          records = data;
          renderRecords();
        }
      };

      const initResult = await window.dataSdk.init(handler);
      if (initResult.isOk) {
        sdkReady = true;
      } else {
        showFeedback("Data absensi belum dapat dimuat. Silakan muat ulang aplikasi.", "error");
      }
    }

    initializeApp();
  </script>
 </body>
</html>
